<!DOCTYPE html>
<html lang="pt-br"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Login</title>
<style>
body { font-family: sans-serif; background: #0d1117; color: #c9d1d9;
       display: flex; align-items: center; justify-content: center; height: 100vh; }
.box { background: #161b22; border: 1px solid #30363d; padding: 2rem;
       border-radius: 8px; text-align: center; max-width: 400px; }
input { background: #0d1117; color: #c9d1d9; border: 1px solid #30363d;
        padding: 0.75rem; border-radius: 4px; width: 100%; margin: 1rem 0; box-sizing: border-box; }
button { padding: 0.75rem 2rem; background: #1f6feb; color: white;
         border: none; border-radius: 6px; cursor: pointer; width: 100%; }
.err { color: #f85149; margin-top: 1rem; }
</style></head>
<body>
<div class="box">
  <h2>🔐 Hermes Dashboard</h2>
  <p>Enter access token</p>
  <form method="get" action="/dashboard">
    <input name="token" placeholder="hermes-2026" autofocus />
    <button type="submit">Enter</button>
  </form>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</div>
</body></html>
