<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Hermes - acesso</title>
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: var(--sp-4); }
.login { width: 100%; max-width: 380px; text-align: center; }
.login .card { margin: 0; }
.login h1 { font-size: 1.2rem; margin-bottom: var(--sp-2); }
.login p { color: var(--muted); font-size: 0.85rem; margin-bottom: var(--sp-4); }
.login input { margin-bottom: var(--sp-3); text-align: center; }
</style>
</head>
<body>
<div class="login">
  <div class="card">
    <h1>Dashboard do Hermes</h1>
    <p>Informe o token de acesso.</p>
    <form method="get" action="{{ url_for('dashboard') }}">
      <input name="token" type="password" placeholder="token" autofocus
             autocomplete="current-password" aria-label="Token de acesso">
      <button class="btn" type="submit" style="width: 100%">Entrar</button>
    </form>
    {% if error %}<p class="notice" style="margin-top: var(--sp-3)">{{ error }}</p>{% endif %}
  </div>
</div>
</body>
</html>
